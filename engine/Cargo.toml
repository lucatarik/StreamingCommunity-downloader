[package]
name = "sc-dl-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.9.2"
cbc = "0.2.1"
m3u8-rs = "6.0.1"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream", "gzip", "charset"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "process", "io-util", "signal", "sync", "time", "io-std"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[profile.release]
# The engine spends its life waiting on sockets, so build time matters more
# than the last few percent of throughput — but LTO is cheap here and the
# binary ships in a container layer, where size is worth something.
lto = "thin"
codegen-units = 1
strip = true
